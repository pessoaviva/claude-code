# Netlify — FinTrack Pro é um app 100% no navegador (sem backend, sem banco).
# Deploy estático: basta publicar o build do React. Sem variáveis de ambiente.

[build]
  command = "npm install && npm run build --workspace=web"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: toda rota serve o app React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
