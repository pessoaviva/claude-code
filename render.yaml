# Render Blueprint — deploy o app E o banco de dados juntos, em um clique.
# Importe este repositório em https://render.com (New + → Blueprint) ou use o
# botão "Deploy to Render" do README. O Postgres é criado e conectado
# automaticamente via DATABASE_URL — sem configuração manual.

databases:
  - name: fintrack-db
    plan: free
    databaseName: fintrack
    user: fintrack

services:
  - type: web
    name: fintrack-pro
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
