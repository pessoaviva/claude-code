/* ============ v2.1 · refinamento de design gráfico + iOS ============ */
:root{--slate:#5d6b73;--slate2:#e7eef1;--muted:#6f5c46;--shadow:0 14px 40px rgba(55,34,13,.12)}

body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
.title{letter-spacing:-.025em;font-weight:900}
.eyebrow{letter-spacing:.16em}
.kpi strong,td,.metric b,.gmditem,.count,.tag{font-variant-numeric:tabular-nums}
.kpi{transition:transform .14s ease}.kpi:active{transform:scale(.98)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nav button,.mobilebar button{user-select:none}
input,select,textarea{font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 1.15em,calc(100% - 13px) 1.15em;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.btn.small{min-height:34px;border-radius:11px}
.btn.full{width:100%}
.tag.slate{background:var(--slate2);color:var(--slate)}
.soldstamp{display:none!important}
.card{border-radius:20px}
.main{padding-bottom:calc(116px + env(safe-area-inset-bottom))}
/* segmented mais arredondado */
.seg button{min-height:34px}
/* ====== bottom sheet / modal ====== */
#modalRoot:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(20,12,4,.46);backdrop-filter:blur(4px);z-index:80;animation:fade .2s ease}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:88vh;overflow:auto;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);z-index:81;padding:18px;animation:pop .22s ease}
.sheet h3{margin:0;font-size:18px}
.sheet-grip{display:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.iconbtn{border:0;background:var(--bg2);color:var(--muted);min-width:36px;height:36px;border-radius:50%;font-weight:900;font-size:15px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form2 .full{grid-column:1/-1}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.moregrid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid var(--line);background:var(--card2);border-radius:18px;color:var(--ink);font-weight:850;font-size:11.5px;text-align:center;min-height:82px;justify-content:center;line-height:1.15}
.moregrid .ico{width:24px;height:24px;color:var(--green)}

@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(max-width:640px){
 .form2{grid-template-columns:1fr}

 .mobilebar button{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:850;padding:5px 0}
 .mobilebar button:nth-child(6){display:flex}
 .mobilebar .ico{margin:0 auto;width:22px;height:22px}
}

function animal(id){return state.animals.find(a=>a.id==id)} function semi(id){return state.semis.find(s=>s.id==id)} function dieta(id){return state.dietas.find(d=>d.id==id)}
function lastW(a){return [...(a.pesagens||[])].sort((x,y)=>new Date(y.d)-new Date(x.d))[0]} function firstW(a){return [...(a.pesagens||[])].sort((x,y)=>new Date(x.d)-new Date(y.d))[0]}
function gain(a){let f=firstW(a), l=lastW(a); return f&&l?Math.max(0,l.kg-f.kg):0} function gmd(a){let f=firstW(a),l=lastW(a),d=f&&l?days(f.d,l.d):0;return d?gain(a)/d:0}
function intervals(a){let p=[...(a.pesagens||[])].sort((x,y)=>new Date(x.d)-new Date(y.d));let r=[];for(let i=1;i<p.length;i++){let d=days(p[i-1].d,p[i].d),g=d?(p[i].kg-p[i-1].kg)/d:0;r.push({from:i,to:i+1,dias:d,g,delta:p[i].kg-p[i-1].kg});}return r}
function gmdPills(a){let ints=intervals(a);return ints.length?ints.map(x=>`<span class="gmditem ${x.g<1.0?'bad':''}">P${x.from}→P${x.to}: ${x.dias}d · ${fmt(x.g)} kg/d</span>`).join(' '):'<span class="mini">sem intervalo</span>'}
function diasFazenda(a){return days(a.dataEntradaFazenda||a.dataCompra)}
function diasDieta(a){if(a.local!=='semi')return 0;let s=semi(a.semiId);return days(a.dataEntradaSemi||s?.inicio)}
function dietaKgDia(d){return (d?.itens||[]).reduce((s,i)=>s+(+i[1]||0),0)}
function dietaCost(d){return (d?.itens||[]).reduce((s,i)=>s+(+i[1]||0)*(+i[2]||0),0)}
function dietaCustoKg(d){let k=dietaKgDia(d);return k?dietaCost(d)/k:0}
function saidaPrevista(s){return s&&s.duracaoDias?addDays(s.inicio,s.duracaoDias):''}
function restanteSemi(s){if(!s||!s.duracaoDias)return null;return Math.round((new Date(saidaPrevista(s))-new Date(today))/86400000)}
function semiAnimals(id,includeSold=true){return state.animals.filter(a=>a.semiId==id&&(includeSold||a.status==='ativo'))} function semiActive(id){return semiAnimals(id,false)}
function semiGain(id){return semiAnimals(id).reduce((s,a)=>s+gain(a),0)} function semiGmd(id){let arr=semiActive(id);return arr.length?arr.reduce((s,a)=>s+gmd(a),0)/arr.length:0}
function semiFeedCost(s){let cost=dietaCost(dieta(s.dietaId));return semiActive(s.id).reduce((sum,a)=>sum+cost*diasDieta(a),0)} function extraCost(id){return state.costs.filter(c=>c.semiId==id).reduce((s,c)=>s+(+c.valor||0),0)} function semiCost(s){return semiFeedCost(s)+extraCost(s.id)} function costPerArroba(s){let ab=arroba(semiGain(s.id));return ab?semiCost(s)/ab:0}
function acquisitionCost(a){return +a.valorCompra||0} function feedCostAnimal(a){let s=semi(a.semiId); if(!s||a.local!=='semi')return 0; return dietaCost(dieta(s.dietaId))*diasDieta(a)} function resultAnimal(a){let venda=a.status==='vendido'?arroba(a.pesoVenda||lastW(a)?.kg||0)*(+a.precoArroba||0):0; let custo=acquisitionCost(a)+feedCostAnimal(a); return {venda,custo,lucro:venda-custo}}
function sugestaoDieta(s){let d=dieta(s.dietaId);if(!d)return['note red','Vincule uma dieta a este lote para avaliar o desempenho.'];let arr=semiActive(s.id);if(!arr.length)return['note','Sem animais ativos no lote para avaliar.'];let temInt=arr.some(a=>intervals(a).length);if(!temInt)return['note','Registre ao menos duas pesagens para calcular o GMD e gerar sugestão de dieta.'];let g=semiGmd(s.id),meta=+s.metaGmd||1.6,diff=g-meta;if(diff>=0.1)return['note green',`GMD ${fmt(g)} acima da meta (${fmt(meta)}). Dieta eficiente. Sugestão: avaliar redução do ingrediente mais caro por kg para baixar o custo/@ sem perder ganho.`];if(diff>=-0.1)return['note green',`GMD ${fmt(g)} dentro da meta (${fmt(meta)}). Manter a dieta atual e monitorar consumo, escore de cocho e preço dos insumos.`];return['note red',`GMD ${fmt(g)} abaixo da meta (${fmt(meta)}). Sugestões: elevar densidade energética (mais milho/WDG), revisar relação volumoso:concentrado, conferir fibra efetiva e consumo de matéria seca. Se ainda não usa ionóforo, considerar monensina/virginiamicina.`];}

te.animals.filter(a=>a.status==='vendido').map(a=>{let r=resultAnimal(a);return `<p class="between"><span>${esc(a.ferro)}</span><b>${brl(r.lucro)}</b></p>`}).join('')||'<p class="muted">Sem vendas registradas.</p>'}</div></div>`}
function dietRanking(){return state.dietas.map(d=>{let ss=state.semis.filter(s=>s.dietaId==d.id),arr=ss.flatMap(s=>semiActive(s.id));let g=arr.length?arr.reduce((a,b)=>a+gmd(b),0)/arr.length:0;return `<p class="between"><span>${esc(d.nome)} <span class="mini">(${brl(dietaCustoKg(d))}/kg)</span></span><b>${fmt(g)}</b></p>`}).join('')}

/* ===================== REBANHO ===================== */
function setFiltro(v){filtroLocal=v;renderRebanho()}
function renderRebanho(){let lista=state.animals.filter(a=>a.status==='ativo'&&(filtroLocal==='todos'||a.local===filtroLocal));
 let rows=lista.map(cardAnimal).join('')||'<div class="empty">Nenhum animal ativo neste filtro. Animais vendidos ou baixados ficam na aba <b>Vendidos &amp; Baixas</b>.</div>';
 $('rebanho').innerHTML=`<div class="card"><h3>${hi('plus')}Cadastrar animal · origem, categoria e local</h3><div class="form">
 <div><label>Ferro</label><input id="a_ferro" placeholder="A-01"></div>
 <div><label>Brinco EID</label><input id="a_eid" placeholder="BR076..."></div>
 <div><label>Raça</label><select id="a_raca">${RACAS.map(r=>`<option>${r}</option>`).join('')}</select></div>
 <div><label>Categoria</label><select id="a_cat">${CATEGORIAS.map(c=>`<option>${c}</option>`).join('')}</select></div>
 <div><label>Sexo</label><select id="a_sexo">${SEXOS.map(s=>`<option>${s}</option>`).join('')}</select></div>
 <div><label>Idade (meses)</label><input type="number" id="a_idade"></div>
 <div><label>Local</label><select id="a_local" onchange="document.getElementById('a_semiwrap').style.opacity=this.value==='semi'?1:.45"><option value="pasto">À pasto</option><option value="semi">Semiconfinamento</option></select></div>
 <div id="a_semiwrap" style="opacity:.45"><label>Semiconfinamento</label><select id="a_semi"><option value="">Não alocar agora</option>${state.semis.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></div>
 <div><label>Entrada na Fazenda Macarujá</label><input type="date" id="a_entrada" value="${today}"></div>
 <div><label>Data compra</label><input type="date" id="a_data" value="${today}"></div>
 <div><label>Peso compra (kg)</label><input type="number" id="a_peso"></div>
 <div><label>Valor compra (R$)</label><input type="number" id="a_valor"></div>
 <div class="wide"><label>Origem / Fazenda / Leilão</label><input id="a_origem" placeholder="Fazenda, leilão ou fornecedor"></div>
 <div><label>Fornecedor</label><input id="a_forn"></div>
 <div><label>&nbsp;</label><button class="btn" onclick="addAnimal()">Cadastrar</button></div>
 </div></div>
 <div class="row" style="margin:14px 0"><div class="seg">
 <button class="${filtroLocal==='todos'?'active':''}" onclick="setFiltro('todos')">Todos</button>
 <button class="${filtroLocal==='pasto'?'active':''}" onclick="setFiltro('pasto')">À pasto</button>
 <button class="${filtroLocal==='semi'?'active':''}" onclick="setFiltro('semi')">Semiconfinamento</button>
 </div><span class="mini">${lista.length} animal(is) ativo(s)</span></div>
 <div class="grid">${rows}</div>`}
function cardAnimal(a){let l=lastW(a),r=resultAnimal(a),sCount=(a.saude||[]).length;let localTag=a.status==='vendido'?'<span class="tag red">Vendido</span>':a.status==='morto'?'<span class="tag slate">Baixa</span>':a.local==='semi'?'<span class="tag gold">Semiconfinamento</span>':'<span class="tag sage">À pasto</span>';
 return `<div class="card animal"><div class="brandiron">${esc(a.ferro||'—')}</div><div><div class="between"><h3>${esc(a.eid||'Sem EID')} ${localTag}</h3><span class="tag blue">${esc(semi(a.semiId)?.nome||'Não alocado')}</span></div>
 <p class="muted">${esc(a.raca||'—')} · ${esc(a.categoria||categoriaSugerida(a))} · ${esc(a.sexo||'—')} · origem: <b>${esc(a.origem||'—')}</b> · fornecedor: <b>${esc(a.fornecedor||'—')}</b></p>
 <div class="row" style="margin:6px 0"><span class="count">${iconSVG('grass')} ${diasFazenda(a)}d na Fazenda Macarujá</span>${a.local==='semi'?semiCountdown(a):''}${sCount?`<span class="count">${iconSVG('saude')} ${sCount} reg. sanitário(s)</span>`:''}</div>
 <div class="metrics"><div class="metric"><small>Compra</small><b>${kg(a.pesoCompra)}</b><span class="mini">${brl(a.valorCompra)}</span></div><div class="metric"><small>Atual</small><b>${l?kg(l.kg):'—'}</b><span class="mini">${l?fdate(l.d):''}</span></div><div class="metric"><small>GMD geral</small><b>${fmt(gmd(a))}</b></div><div class="metric"><small>Lucro</small><b>${a.status==='vendido'?brl(r.lucro):'—'}</b></div></div>
 <div class="gmdline">${gmdPills(a)}</div></div>
 <div class="actions row"><button class="btn small blue" onclick="addPeso(${a.id})">+ peso</button><button class="btn small secondary" onclick="show('saude')">+ saúde</button><button class="btn small gold" onclick="moveOne(${a.id})">Mover</button><button class="btn small" onclick="sell(${a.id})">Vendido</button><button class="btn small red" onclick="die(${a.id})">Morreu</button></div></div>`}
function semiCountdown(a){let s=semi(a.semiId);if(!s)return '';let dd=diasDieta(a);let r=restanteSemi(s);let base=`<span class="count">${iconSVG('timer')} ${dd}d na dieta</span>`;if(r==null)return base;let cls=r<=0?'warn':(r<=7?'warn':'ok');return base+` <span class="count ${cls}">${r>0?'⏱ '+r+'d p/ saída':'⏱ saída prevista'}</span>`}
function addAnimal(){let id=Date.now(),peso=+$('a_peso').value||0,local=$('a_local').value,semiId=(local==='semi'&&$('a_semi').value)?+$('a_semi').value:null,dataC=$('a_data').value;
 state.animals.unshift({id,ferro:$('a_ferro').value,eid:$('a_eid').value,raca:$('a_raca').value,categoria:$('a_cat').value,sexo:$('a_sexo').value,idade:+$('a_idade').value||0,local,dataCompra:dataC,dataEntradaFazenda:$('a_entrada').value||dataC,pesoCompra:peso,valorCompra:+$('a_valor').value||0,origem:$('a_origem').value,fornecedor:$('a_forn').value,leilao:'',semiId,dataEntradaSemi:semiId?today:null,status:'ativo',pesagens:peso?[{d:dataC||today,kg:peso}]:[],saude:[]});
 if(semiId)state.moves.unshift({animalId:id,semiId,d:today,tipo:'Entrada'});save(false);render();toast('Animal cadastrado.')}

/* ===================== SEMICONFINAMENTOS ===================== */
function renderSemis(){let cards=state.semis.map(s=>{let ativos=semiActive(s.id),vend=semiAnimals(s.id).filter(a=>a.status==='vendido'),r=restanteSemi(s),sug=sugestaoDieta(s);return `<div class="card clickable" onclick="openSemiDetail(${s.id})"><div class="between"><h3>${hi('semis')}${esc(s.nome)}</h3><span class="tag ${semiGmd(s.id)>=s.metaGmd?'':'red'}">GMD ${fmt(semiGmd(s.id))}</span></div>
 <p class="muted">${esc(dieta(s.dietaId)?.nome||'sem dieta')} · entrada ${fdate(s.inicio)} · objetivo GMD ${fmt(s.metaGmd)}</p>
 <div class="row" style="margin:6px 0">${r!=null?`<span class="count ${r<=0?'warn':(r<=7?'warn':'ok')}">${iconSVG('timer')} ${r>0?r+'d p/ saída':'saída prevista atingida'}</span>`:''}<span class="count">saída prev.: ${fdate(saidaPrevista(s))||'—'}</span></div>
 <div class="metrics"><div class="metric"><small>Ativos</small><b>${ativos.length}</b></div><div class="metric"><small>Vendidos</small><b>${vend.length}</b></div><div class="metric"><small>@ produzidas</small><b>${fmt(arroba(semiGain(s.id)))}</b></div><div class="metric"><small>Custo/@</small><b>${brl(costPerArroba(s))}</b></div></div>
 <div class="progress" style="margin-top:12px"><span style="width:${Math.min(100,semiGmd(s.id)/(s.metaGmd||1.6)*100)}%"></span></div>
 <p class="mini" style="margin:10px 0 0">Clique para abrir a lista completa, dias na dieta e desempenho individual.</p></div>`}).join('');
 $('semis').innerHTML=`<div class="card"><h3>${hi('plus')}Novo semiconfinamento</h3><div class="form">
 <div><label>Nome</label><input id="s_nome" placeholder="Lote 3 Sicredi"></div>
 <div><label>Data de entrada</label><input type="date" id="s_inicio" value="${today}"></div>
 <div><label>Dieta</label><select id="s_dieta">${state.dietas.map(d=>`<option value="${d.id}">${esc(d.nome)}</option>`).join('')}</select></div>
 <div><label>Objetivo GMD (kg/dia)</label><input type="number" step="0.01" id="s_meta" value="1.60"></div>
 <div><label>Duração prevista (dias)</label><input type="number" id="s_dur" value="90"></div>
 <div><label>Peso alvo de saída (kg)</label><input type="number" id="s_alvo" placeholder="540"></div>
 <div><label>&nbsp;</label><button class="btn" onclick="addSemi()">Criar lote</button></div>
 </div></div><div class="cards" style="margin-top:14px">${cards}</div>`}
function openSemiDetail(id){let s=semi(id);if(!s)return;let all=semiAnimals(id),ativos=all.filter(a=>a.status!=='vendido'),vend=all.filter(a=>a.status==='vendido');let r=restanteSemi(s);let sug=sugestaoDieta(s);
 let table=(arr,vendidos=false)=>arr.length?`<div class="tablewrap"><table><tr><th>Animal</th><th>Brinco/EID</th><th>Raça/Cat.</th><th>Origem</th><th>Dias na dieta</th><th>Peso atual</th><th>GMD</th><th>Intervalos</th><th>Custo alim.</th><th></th></tr>${arr.map(a=>{let l=lastW(a),ra=resultAnimal(a),rest=restanteSemi(s);return `<tr><td><b>${esc(a.ferro||'—')}</b></td><td>${esc(a.eid||'—')}</td><td>${esc(a.raca||'—')}<br><span class="mini">${esc(a.categoria||'')}</span></td><td>${esc(a.origem||'—')}<br><span class="mini">${esc(a.fornecedor||'')}</span></td><td><b>${diasDieta(a)}d</b>${!vendidos&&rest!=null?`<br><span class="mini">${rest>0?rest+'d restantes':'saída prev.'}</span>`:''}</td><td>${l?kg(l.kg):'—'}<br><span class="mini">${l?fdate(l.d):''}</span></td><td><b>${fmt(gmd(a))}</b></td><td>${gmdPills(a)}</td><td>${brl(feedCostAnimal(a))}</td><td><button class="btn small blue" onclick="event.stopPropagation();addPeso(${a.id})">+ peso</button>${!vendidos?` <button class="btn small red" onclick="event.stopPropagation();sell(${a.id})">Vendido</button>`:`<br><span class="mini">${fdate(a.dataVenda)} · ${brl(ra.venda)}</span>`}</td></tr>`}).join('')}</table></div>`:'<div class="empty">Nenhum animal nesta seção.</div>';
 let d=dieta(s.dietaId);
 $('semis').innerHTML=`<div class="semi-head"><div><div class="eyebrow">Semiconfinamento</div><div class="title">${esc(s.nome)}</div><div class="sub">${esc(d?.nome||'sem dieta')} · entrada ${fdate(s.inicio)} · objetivo GMD ${fmt(s.metaGmd)}</div></div><button class="btn secondary" onclick="renderSemis()">← Voltar aos lotes</button></div>
 <div class="cards"><div class="card"><h3>Resumo do lote</h3><div class="metrics"><div class="metric"><small>Ativos</small><b>${ativos.length}</b></div><div class="metric"><small>Vendidos</small><b>${vend.length}</b></div><div class="metric"><small>GMD médio</small><b>${fmt(semiGmd(id))}</b></div><div class="metric"><small>Custo/@</small><b>${brl(costPerArroba(s))}</b></div></div>
 <div class="row" style="margin-top:10px"><span class="count">Entrada: ${fdate(s.inicio)}</span><span class="count">Saída prev.: ${fdate(saidaPrevista(s))||'—'}</span>${r!=null?`<span class="count ${r<=0?'warn':(r<=7?'warn':'ok')}">${iconSVG('timer')} ${r>0?r+'d restantes':'saída prevista atingida'}</span>`:''}</div></div>
 <div class="card"><h3>Dieta & custo por kg</h3><p><b>${esc(d?.nome||'—')}</b></p><p class="muted">Custo da ração: <b>${brl(dietaCustoKg(d))}/kg</b> · <b>${brl(dietaCost(d)||0)}/cab/dia</b> · ${fmt(dietaKgDia(d))} kg MS/dia</p><div class="${sug[0]}" style="margin-top:8px">${sug[1]}</div></div>
 <div class="card"><h3>Resultado do lote</h3><p class="between"><span>@ produzidas</span><b>${fmt(arroba(semiGain(id)))}</b></p><p class="between"><span>Custo alimentar</span><b>${brl(semiFeedCost(s))}</b></p><p class="between"><span>Custos extras</span><b>${brl(extraCost(s.id))}</b></p><p class="between"><span>Custo/@ produzida</span><b>${brl(costPerArroba(s))}</b></p></div></div>
 <div class="card" style="margin-top:14px"><h3>Animais ativos · desempenho individual</h3>${table(ativos,false)}</div>
 <div class="card" style="margin-top:14px"><h3>Vendidos no final do lote</h3>${table(vend,true)}</div>`}
function addSemi(){state.semis.push({id:Date.now(),nome:$('s_nome').value||'Novo lote',inicio:$('s_inicio').value,dietaId:+$('s_dieta').value,metaGmd:+$('s_meta').value||1.6,duracaoDias:+$('s_dur').value||90,pesoAlvo:+$('s_alvo').value||0});save(false);render();toast('Lote criado.')}

/* ===================== DIETAS ===================== */
function renderDietas(){$('dietas').innerHTML=`<div class="cards">${state.dietas.map(d=>`<div class="card"><div class="between"><h3>${hi('dietas')}${esc(d.nome)}</h3><span class="tag gold">${brl(dietaCustoKg(d))}/kg</span></div>
 <p class="mini">${brl(dietaCost(d))}/cab/dia · ${fmt(dietaKgDia(d))} kg matéria seca/dia</p>
 <table><tr><th>Ingrediente</th><th>kg/dia</th><th>R$/kg</th><th>Custo</th></tr>${d.itens.map((i,idx)=>`<tr><td><input value="${esc(i[0])}" onchange="dieta(${d.id}).itens[${idx}][0]=this.value;save(false);render()"></td><td><input type="number" step="0.01" value="${i[1]}" onchange="dieta(${d.id}).itens[${idx}][1]=+this.value;save(false);render()"></td><td><input type="number" step="0.01" value="${i[2]}" onchange="dieta(${d.id}).itens[${idx}][2]=+this.value;save(false);render()"></td><td>${brl((+i[1]||0)*(+i[2]||0))}<br><button class="btn small red" onclick="delItemDieta(${d.id},${idx})">×</button></td></tr>`).join('')}</table>
 <button class="btn secondary small" onclick="addItemDieta(${d.id})">+ ingrediente</button></div>`).join('')}</div>
 <div class="card" style="margin-top:14px"><h3>Nova dieta</h3><div class="form"><div class="wide"><label>Nome</label><input id="d_nome" placeholder="Dieta 3 · WDG + mandioca"></div><div><label>&nbsp;</label><button class="btn" onclick="addDieta()">Criar dieta</button></div></div></div>`}
function addDieta(){state.dietas.push({id:Date.now(),nome:$('d_nome').value||'Nova dieta',itens:[['Novo ingrediente',0,0]]});save(false);render()}
function addItemDieta(id){dieta(id).itens.push(['Novo ingrediente',0,0]);save(false);render()}
function delItemDieta(id,idx){dieta(id).itens.splice(idx,1);save(false);render()}

/* ===================== SAÚDE ===================== */
function onTipoSaude(){let t=$('sa_tipo').value;$('sa_prod').innerHTML=(SAUDE_TIPOS[t]||[]).map(p=>`<option>${p}</option>`).join('')}
function setFiltroSaude(v){filtroSaude=v;renderSaude()}
function renderSaude(){let alvos=state.animals.filter(a=>a.status==='ativo');
 let registros=[];state.animals.forEach(a=>(a.saude||[]).forEach((s,idx)=>registros.push({a,s,idx})));
 registros.sort((x,y)=>new Date(y.s.d)-new Date(x.s.d));
 if(filtroSaude!=='todos')registros=registros.filter(r=>r.s.tipo===filtroSaude);
 let tipos=Object.keys(SAUDE_TIPOS);
 $('saude').innerHTML=`<div class="card"><h3>${hi('saude')}Registrar manejo sanitário</h3><p class="muted">Vacinas, vermífugos, vitaminas e modificadores orgânicos. Escolha o tipo e o produto; use "Outro" para itens fora da lista.</p>
 <div class="form">
 <div class="wide"><label>Animal</label><select id="sa_animal">${alvos.map(a=>`<option value="${a.id}">${esc(a.ferro||'—')} · ${esc(a.eid||'')} (${esc(a.local==='semi'?'semi':'pasto')})</option>`).join('')}</select></div>
 <div><label>Tipo</label><select id="sa_tipo" onchange="onTipoSaude()">${tipos.map(t=>`<option>${t}</option>`).join('')}</select></div>
 <div><label>Produto</label><select id="sa_prod">${(SAUDE_TIPOS[tipos[0]]).map(p=>`<option>${p}</option>`).join('')}</select></div>
 <div><label>Outro (especificar)</label><input id="sa_outro" placeholder="se fora da lista"></div>
 <div><label>Dose / via</label><input id="sa_dose" placeholder="5 mL SC"></div>
 <div><label>Data</label><input type="date" id="sa_data" value="${today}"></div>
 <div class="wide"><label>Observação</label><input id="sa_obs" placeholder="reforço, lote, carência..."></div>
 <div><label>&nbsp;</label><button class="btn" onclick="addSaude()">Registrar</button></div>
 </div></div>
 <div class="cards" style="margin-top:14px">${tipos.map(t=>{let n=registros.filter(r=>r.s.tipo===t).length;let total=state.animals.reduce((c,a)=>c+(a.saude||[]).filter(x=>x.tipo===t).length,0);return `<div class="card"><div class="between"><b>${t}</b><span class="tag ${t==='Vacina'?'green':t==='Vermífugo'?'blue':t==='Vitamina'?'gold':'purple'}">${total}</span></div><p class="mini">${SAUDE_TIPOS[t].slice(0,4).join(' · ')}…</p></div>`}).join('')}</div>
 <div class="row" style="margin:14px 0"><div class="seg"><button class="${filtroSaude==='todos'?'active':''}" onclick="setFiltroSaude('todos')">Todos</button>${tipos.map(t=>`<button class="${filtroSaude===t?'active':''}" onclick="setFiltroSaude('${t}')">${t}</button>`).join('')}</div></div>
 <div class="card"><h3>Histórico sanitário do rebanho</h3>${registros.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Animal</th><th>Tipo</th><th>Produto</th><th>Dose/via</th><th>Obs.</th><th></th></tr>${registros.map(r=>`<tr><td>${fdate(r.s.d)}</td><td><b>${esc(r.a.ferro||'—')}</b><br><span class="mini">${esc(r.a.eid||'')}</span></td><td><span class="tag ${r.s.tipo==='Vacina'?'green':r.s.tipo==='Vermífugo'?'blue':r.s.tipo==='Vitamina'?'gold':'purple'}">${esc(r.s.tipo)}</span></td><td>${esc(r.s.produto)}</td><td>${esc(r.s.dose||'—')}</td><td class="mini">${esc(r.s.obs||'')}</td><td><button class="btn small red" onclick="delSaude(${r.a.id},${r.idx})">×</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum registro sanitário ainda.</div>'}</div>`}

 </div>
 <div class="card"><h3>${hi('sale')}Animais vendidos</h3>${vend.length?`<div class="tablewrap"><table><tr><th>Animal</th><th>Raça/Cat.</th><th>Lote origem</th><th>Comprador · CPF/CNPJ</th><th>Data</th><th>Peso</th><th>R$/@</th><th>Receita</th><th>Lucro</th><th></th></tr>${vrows}</table></div>`:'<div class="empty">Nenhuma venda registrada. Use o botão <b>Vendido</b> no card do animal (aba Rebanho).</div>'}</div>

function reactivate(id){let a=animal(id);if(!a)return;if(!confirm('Reativar este animal e devolvê-lo ao rebanho ativo? Os dados de venda/baixa serão apagados.'))return;a.status='ativo';delete a.dataVenda;delete a.pesoVenda;delete a.precoArroba;delete a.comprador;delete a.cpfComprador;delete a.loteVendaNome;delete a.semiVendaId;delete a.vendaObs;delete a.morte;save(false);render();toast('Animal reativado.')}

/* ===================== NUVEM: AUTH + SYNC ===================== */
async function cloudLogin(){try{setCloudCfg($('sb_url').value,$('sb_key').value);let db=cloudClient();let {data,error}=await db.auth.signInWithPassword({email:$('au_email').value.trim(),password:$('au_pass').value});if(error)throw error;cloudSession=data.session;toast('Login Supabase OK.');renderConfig();save(false)}catch(e){alert('Falha no login: '+e.message)}}
async function cloudSignup(){try{setCloudCfg($('sb_url').value,$('sb_key').value);let db=cloudClient();let {data,error}=await db.auth.signUp({email:$('au_email').value.trim(),password:$('au_pass').value});if(error)throw error;alert('Conta criada. Confirme o e-mail (se exigido) e faça login.');}catch(e){alert('Falha ao criar conta: '+e.message)}}
async function cloudLogout(){try{let db=cloudClient();await db.auth.signOut();cloudSession=null;toast('Sessão encerrada.');renderConfig();save(false)}catch(e){alert(e.message)}}
async function testCloud(){try{setCloudCfg($('sb_url').value,$('sb_key').value);let db=cloudClient();await refreshSession();requireSession();await must(await db.from('animais').select('id').limit(1));toast('Conexão Supabase OK (autenticado).');}catch(e){alert('Falha: '+e.message)}}
async function tableAvailable(db,t){let r=await db.from(t).select('id').limit(1);return !r.error}
async function saveCloud(){try{requireSession();let db=cloudClient();if(!confirm('Enviar os dados locais para o Supabase? Isso substitui os seus dados na nuvem.'))return;toast('Enviando para Supabase...');
  const hasSaude=await tableAvailable(db,'saude');const hasIng=await tableAvailable(db,'ingredientes')&&await tableAvailable(db,'dieta_itens');const hasBaixas=await tableAvailable(db,'baixas');
  const clear=['vendas','custos','pesagens','movimentacoes'].concat(hasBaixas?['baixas']:[]).concat(hasSaude?['saude']:[]).concat(hasIng?['dieta_itens']:[]).concat(['semiconfinamentos','dietas']).concat(hasIng?['ingredientes']:[]).concat(['animais']);
  for(const t of clear){await must(await db.from(t).delete().neq('id',0));}
  const dietas=state.dietas.length?await must(await db.from('dietas').insert(state.dietas.map(d=>({nome:d.nome,observacoes:hasIng?'':JSON.stringify({itens:d.itens||[]})}))).select()):[];
  const dietaMap={};dietas.forEach((d,i)=>dietaMap[state.dietas[i]?.id]=d.id);
  if(hasIng){const uniq={};state.dietas.forEach(d=>(d.itens||[]).forEach(i=>{let nome=(i[0]||'Ingrediente').trim();uniq[nome]={nome,preco_kg:+i[2]||0}}));const ingList=Object.values(uniq);const ing=ingList.length?await must(await db.from('ingredientes').insert(ingList).select()):[];const ingMap={};ing.forEach(x=>ingMap[x.nome]=x.id);const itens=[];state.dietas.forEach(d=>(d.itens||[]).forEach(i=>{let nome=(i[0]||'Ingrediente').trim();itens.push({dieta_id:dietaMap[d.id],ingrediente_id:ingMap[nome],kg_animal_dia:+i[1]||0,preco_kg_snapshot:+i[2]||0})}));if(itens.length)await must(await db.from('dieta_itens').insert(itens));}
  const semis=state.semis.length?await must(await db.from('semiconfinamentos').insert(state.semis.map(s=>({nome:s.nome,dieta_id:dietaMap[s.dietaId]||null,data_inicio:s.inicio||null,meta_gmd:+s.metaGmd||1.6,duracao_dias:+s.duracaoDias||0,peso_alvo:+s.pesoAlvo||0}))).select()):[];
  const semiMap={};semis.forEach((s,i)=>semiMap[state.semis[i]?.id]=s.id);
  const animais=state.animals.length?await must(await db.from('animais').insert(state.animals.map(a=>({eid:a.eid||null,ferro:a.ferro||null,raca:a.raca||null,categoria:a.categoria||null,sexo:a.sexo||null,idade:+a.idade||null,local:a.local||'pasto',origem:a.origem||null,fornecedor:a.fornecedor||null,data_compra:a.dataCompra||null,data_entrada_fazenda:a.dataEntradaFazenda||null,peso_compra:+a.pesoCompra||null,valor_compra:+a.valorCompra||0,status:a.status||'ativo'}))).select()):[];
  const animalMap={};animais.forEach((a,i)=>animalMap[state.animals[i].id]=a.id);
  const pes=[];state.animals.forEach(a=>(a.pesagens||[]).forEach(p=>pes.push({animal_id:animalMap[a.id],data_pesagem:p.d,peso:+p.kg||0,origem_leitura:p.fonte||'manual'})));if(pes.length)await must(await db.from('pesagens').insert(pes));
  const movs=(state.moves||[]).map(m=>({animal_id:animalMap[m.animalId],semiconfinamento_id:semiMap[m.semiId]||null,entrada:m.d||today,tipo:m.tipo||'Entrada'})).filter(x=>x.animal_id);if(movs.length)await must(await db.from('movimentacoes').insert(movs));
  const custos=(state.costs||[]).map(c=>({semiconfinamento_id:semiMap[c.semiId]||null,tipo:c.tipo||null,descricao:c.desc||'',valor:+c.valor||0,data_lancamento:today}));if(custos.length)await must(await db.from('custos').insert(custos));
  if(hasSaude){const sa=[];state.animals.forEach(a=>(a.saude||[]).forEach(s=>sa.push({animal_id:animalMap[a.id],data_evento:s.d,tipo:s.tipo,produto:s.produto,dose:s.dose||'',observacao:s.obs||''})));if(sa.length)await must(await db.from('saude').insert(sa));}
  const vendas=state.animals.filter(a=>a.status==='vendido').map(a=>({animal_id:animalMap[a.id],data_venda:a.dataVenda||today,peso_venda:+a.pesoVenda||null,arrobas:arroba(+a.pesoVenda||0),valor_arroba:+a.precoArroba||0,comprador:a.comprador||'',cpf_comprador:a.cpfComprador||'',lote_nome:a.loteVendaNome||'',semiconfinamento_id:semiMap[a.semiVendaId]||null,observacao:a.vendaObs||'',valor_total:arroba(+a.pesoVenda||0)*(+a.precoArroba||0)}));if(vendas.length)await must(await db.from('vendas').insert(vendas));
  if(hasBaixas){const bx=state.animals.filter(a=>a.status==='morto'&&a.morte).map(a=>({animal_id:animalMap[a.id],data_morte:a.morte.d||today,causa:a.morte.causa||'',cercado:a.morte.cercado||'',observacao:a.morte.obs||''}));if(bx.length)await must(await db.from('baixas').insert(bx));}
  toast('Dados enviados para Supabase com segurança.');
}catch(e){alert('Erro ao salvar no Supabase: '+e.message)}}
async function loadCloud(){try{requireSession();if(!confirm('Carregar dados da nuvem e substituir os dados locais deste aparelho?'))return;let db=cloudClient();toast('Carregando Supabase...');
  const hasSaude=await tableAvailable(db,'saude');const hasIng=await tableAvailable(db,'ingredientes')&&await tableAvailable(db,'dieta_itens');const hasBaixas=await tableAvailable(db,'baixas');
  const base=[db.from('animais').select('*').order('id'),db.from('dietas').select('*').order('id'),db.from('semiconfinamentos').select('*').order('id'),db.from('pesagens').select('*').order('data_pesagem'),db.from('custos').select('*').order('id'),db.from('movimentacoes').select('*').order('id'),db.from('vendas').select('*').order('id')];
  const [animais,dietas,semis,pesagens,custos,movs,vendas]=await Promise.all(base.map(async p=>must(await p)));
  let ing=[],di=[],saude=[],baixas=[];if(hasIng){[ing,di]=await Promise.all([db.from('ingredientes').select('*'),db.from('dieta_itens').select('*')].map(async p=>must(await p)));}if(hasSaude){saude=await must(await db.from('saude').select('*'));}if(hasBaixas){baixas=await must(await db.from('baixas').select('*'));}
  const ingById={};ing.forEach(i=>ingById[i.id]=i);
  state.dietas=dietas.map(d=>({id:d.id,nome:d.nome,itens:hasIng?di.filter(x=>x.dieta_id==d.id).map(x=>[ingById[x.ingrediente_id]?.nome||'Ingrediente',+x.kg_animal_dia||0,+x.preco_kg_snapshot||+ingById[x.ingrediente_id]?.preco_kg||0]):(parseObs(d.observacoes,{itens:[]}).itens||[])}));
  state.semis=semis.map(s=>({id:s.id,nome:s.nome,inicio:s.data_inicio,dietaId:s.dieta_id,metaGmd:+s.meta_gmd||1.6,duracaoDias:+s.duracao_dias||90,pesoAlvo:+s.peso_alvo||0}));
  state.animals=animais.map(a=>({id:a.id,eid:a.eid,ferro:a.ferro,raca:a.raca,categoria:a.categoria,sexo:a.sexo,idade:a.idade||'',local:a.local||'pasto',origem:a.origem,fornecedor:a.fornecedor,leilao:'',dataCompra:a.data_compra,dataEntradaFazenda:a.data_entrada_fazenda,pesoCompra:+a.peso_compra||0,valorCompra:+a.valor_compra||0,semiId:null,dataEntradaSemi:null,status:a.status||'ativo',pesagens:[],saude:[]}));
  const byId=id=>state.animals.find(a=>a.id==id);
  pesagens.forEach(p=>{let a=byId(p.animal_id);if(a)a.pesagens.push({d:p.data_pesagem,kg:+p.peso||0,fonte:p.origem_leitura||'Supabase'})});
  saude.forEach(s=>{let a=byId(s.animal_id);if(a)a.saude.push({d:s.data_evento,tipo:s.tipo,produto:s.produto,dose:s.dose,obs:s.observacao})});
  state.moves=movs.map(m=>({animalId:m.animal_id,semiId:m.semiconfinamento_id,d:m.entrada,tipo:m.tipo||'Movimentação'}));
  movs.forEach(m=>{let a=byId(m.animal_id);if(a&&m.semiconfinamento_id&&m.tipo!=='Pasto'){a.semiId=m.semiconfinamento_id;a.local='semi';a.dataEntradaSemi=m.entrada}});
  state.costs=custos.map(c=>({id:c.id,semiId:c.semiconfinamento_id,tipo:c.tipo,desc:c.descricao,valor:+c.valor||0}));
  vendas.forEach(v=>{let a=byId(v.animal_id);if(a){a.status='vendido';a.dataVenda=v.data_venda;a.pesoVenda=+v.peso_venda||0;a.precoArroba=+v.valor_arroba||0;a.comprador=v.comprador||'';a.cpfComprador=v.cpf_comprador||'';a.loteVendaNome=v.lote_nome||'';a.semiVendaId=v.semiconfinamento_id||null;a.vendaObs=v.observacao||''}});
  baixas.forEach(b=>{let a=byId(b.animal_id);if(a){a.status='morto';a.morte={d:b.data_morte,causa:b.causa||'',cercado:b.cercado||'',obs:b.observacao||''}}});
  migrate();save(false);render();toast('Dados carregados da nuvem.');
}catch(e){alert('Erro ao carregar Supabase: '+e.message)}}

function renderConfig(){let c=cloudCfg();let logged=!!cloudSession;let email=cloudSession?.user?.email||'';
 $('config').innerHTML=`<div class="cards">
 <div class="card"><h3>${hi('cloud')}Supabase Cloud</h3><p class="muted">Cole a URL do projeto e a <b>Publishable/Anon Key</b> (chave pública). A <b>service_role</b> NUNCA deve ser usada aqui. A chave fica só neste navegador.</p>
 <label>Project URL</label><input id="sb_url" value="${esc(c.url||'')}" placeholder="https://xxxx.supabase.co" autocomplete="off">
 <label style="margin-top:8px">Publishable / Anon Key</label><input id="sb_key" value="${esc(c.key||'')}" placeholder="sb_publishable_... ou anon public" autocomplete="off">
 <div class="row" style="margin-top:12px"><button class="btn" onclick="setCloudCfg($('sb_url').value,$('sb_key').value);toast('Configuração salva.');renderConfig()">Salvar configuração</button><button class="btn secondary" onclick="testCloud()">Testar conexão</button></div></div>
 <div class="card"><h3>${hi('lock')}Acesso seguro (Auth)</h3>${logged?`<div class="note green">Autenticado como <b>${esc(email)}</b>. A sincronização está liberada apenas para a sua conta (RLS por dono).</div><div class="row" style="margin-top:12px"><button class="btn red" onclick="cloudLogout()">Sair da conta</button></div>`:`<p class="muted">A sincronização exige login. Sem isso, ninguém com a URL acessa seus dados (RLS amarrado ao usuário).</p><label>E-mail</label><input id="au_email" type="email" autocomplete="username" placeholder="voce@fazenda.com"><label style="margin-top:8px">Senha</label><input id="au_pass" type="password" autocomplete="current-password" placeholder="••••••••"><div class="row" style="margin-top:12px"><button class="btn" onclick="cloudLogin()">Entrar</button><button class="btn secondary" onclick="cloudSignup()">Criar conta</button></div>`}</div>
 <div class="card"><h3>${hi('backup')}Sincronização</h3><p class="muted">v2.0 grava também categoria, local (pasto/semi), saída prevista e o módulo de Saúde.</p><div class="row"><button class="btn ${logged?'':'secondary'}" onclick="saveCloud()">Enviar local → Supabase</button><button class="btn blue" onclick="loadCloud()">Carregar Supabase → aparelho</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="row"><button class="btn secondary" onclick="downloadBackup()">Baixar JSON</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Importar JSON</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importBackup(event)"><button class="btn secondary" onclick="resetDemo()">Restaurar exemplo</button></div></div>
 </div>
 <div class="card" style="margin-top:14px"><h3>${hi('lock')}Boas práticas de segurança (Vercel + Supabase + domínio próprio)</h3>
 <div class="note">1. Rode o <b>SQL de segurança</b> (arquivo <code>supabase.sql</code>) — ele liga RLS em todas as tabelas e amarra cada linha ao <code>auth.uid()</code> do dono.</div>
 <div class="note" style="margin-top:8px">2. Use somente a <b>anon/publishable key</b> no front. A <b>service_role</b> jamais vai para o navegador/Vercel público.</div>
 <div class="note" style="margin-top:8px">3. No Supabase → Authentication → URL Configuration, restrinja o <b>Site URL</b> e os <b>Redirect URLs</b> ao seu domínio. Em Auth, ative confirmação de e-mail e senha forte.</div>
 <div class="note" style="margin-top:8px">4. No Vercel, sirva por HTTPS (padrão) e adicione cabeçalhos de segurança via <code>vercel.json</code> (CSP, HSTS, X-Frame-Options) — já incluído no projeto.</div>
 <div class="note" style="margin-top:8px">5. Ative MFA na sua conta Supabase/Vercel e faça <b>backup</b> (JSON) periódico.</div>
 </div>
 <div class="card" style="margin-top:14px"><h3>${hi('app')}Ícone do App / SQL</h3><div class="abmark" style="width:84px;height:84px;border-radius:26px;font-size:38px;margin-bottom:12px">AB</div><p class="muted">No iPhone: Safari → Compartilhar → Adicionar à Tela de Início. O script SQL completo (tabelas + RLS por dono + Saúde + RFID) está no arquivo <code>supabase.sql</code> do projeto.</p></div>`}
function downloadBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-macaruja-v2.json';a.click()}
function importBackup(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj.animals)throw new Error('Arquivo inválido.');state=obj;migrate();save(false);render();toast('Backup importado.')}catch(e){alert('Falha ao importar: '+e.message)}};r.readAsText(f)}
function resetDemo(){if(confirm('Apagar dados locais e voltar ao exemplo?')){localStorage.removeItem(SKEY);seed();migrate();save(false);render()}}

load();nav();render();refreshSession().then(()=>{if($('saveBadge'))$('saveBadge').textContent=cloudStatus()});
</script>
